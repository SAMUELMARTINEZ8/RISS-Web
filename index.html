<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RIS - Prototipo V1.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-[#0b0e14] font-sans text-white">

    <nav class="bg-[#151a23] text-white shadow-lg border-b border-[#232b38]">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3">
                    <i class="fa-solid fa-server text-[#00d2ff] text-xl"></i>
                    <span class="font-bold text-xl tracking-wider">RIS <span class="text-[#00d2ff] text-sm">V1.0</span></span>
                </div>
                <div>
                    <span class="bg-emerald-500/20 text-emerald-400 border border-emerald-500 text-xs font-bold px-3 py-1.5 rounded-full flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Sistema En Línea
                    </span>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <div class="mb-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
                <h1 class="text-2xl font-bold text-white">Supervisión de Caldera Principal</h1>
                <p class="text-sm text-gray-400">Módulo K2E | ID: CAL-001 | Hotel Sede</p>
            </div>
            <div class="flex gap-2">
                <button class="bg-[#1f2937] hover:border-[#00d2ff] hover:text-[#00d2ff] border border-[#374151] text-white px-4 py-2 rounded shadow text-sm font-medium transition-all">
                    <i class="fa-solid fa-gear mr-2"></i> Ajustar Válvulas
                </button>
                <button class="bg-gradient-to-r from-red-500 to-red-700 hover:from-red-600 hover:to-red-800 text-white px-4 py-2 rounded shadow-lg shadow-red-500/30 text-sm font-bold transition-all">
                    <i class="fa-solid fa-triangle-exclamation mr-2"></i> Paro de Emergencia
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-6 mb-8">
            <div class="bg-[#151a23] rounded-xl shadow-sm border border-[#232b38] p-5 border-l-4 border-l-[#00d2ff]">
                <p class="text-sm font-medium text-gray-400 mb-1">Temperatura Actual</p>
                <h3 id="kpi-actual" class="text-3xl font-bold text-white">-- °C</h3>
            </div>
            <div class="bg-[#151a23] rounded-xl shadow-sm border border-[#232b38] p-5 border-l-4 border-l-red-500">
                <p class="text-sm font-medium text-gray-400 mb-1">Pico Máximo (Sesión)</p>
                <h3 id="kpi-max" class="text-3xl font-bold text-white">-- °C</h3>
            </div>
            <div class="bg-[#151a23] rounded-xl shadow-sm border border-[#232b38] p-5 border-l-4 border-l-emerald-500">
                <p class="text-sm font-medium text-gray-400 mb-1">Mínimo (Sesión)</p>
                <h3 id="kpi-min" class="text-3xl font-bold text-white">-- °C</h3>
            </div>
        </div>

        <div class="bg-[#151a23] rounded-xl shadow-sm border border-[#232b38] overflow-hidden">
            <div class="px-6 py-4 border-b border-[#232b38] bg-[#1a212d] flex justify-between items-center">
                <h2 id="titulo-grafica" class="text-lg font-semibold text-white">
                    <i class="fa-solid fa-temperature-half mr-2 text-[#00d2ff]"></i> Telemetría PT-1000
                </h2>
            </div>
            <div class="p-6">
                <div class="h-72 w-full">
                    <canvas id="miGrafica"></canvas>
                </div>
            </div>
        </div>

        <div class="mt-12 text-center">
            <p class="text-gray-500 text-sm font-medium tracking-wide">Developed by Martinez Reyes Samuel</p>
        </div>

    </main>

    <script>
        const ctx = document.getElementById('miGrafica').getContext('2d');
        
        // Degradado neón para la gráfica
        const gradient = ctx.createLinearGradient(0, 0, 0, 400);
        gradient.addColorStop(0, 'rgba(0, 210, 255, 0.4)');
        gradient.addColorStop(1, 'rgba(0, 210, 255, 0.0)');

        const graficaTemperatura = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [], 
                datasets: [{
                    label: 'Temperatura (°C)',
                    data: [], 
                    borderColor: '#00d2ff',
                    backgroundColor: gradient,
                    borderWidth: 2,
                    pointBackgroundColor: '#0b0e14',
                    pointBorderColor: '#00d2ff',
                    pointBorderWidth: 2,
                    pointRadius: 4,
                    fill: true,
                    tension: 0.4 
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { 
                    legend: { display: false },
                    tooltip: {
                        backgroundColor: '#151a23',
                        titleColor: '#8b949e',
                        bodyColor: '#ffffff',
                        borderColor: '#232b38',
                        borderWidth: 1
                    }
                },
                scales: {
                    y: {
                        beginAtZero: false,
                        suggestedMin: 65,
                        suggestedMax: 95,
                        grid: { color: '#232b38', borderDash: [4, 4] },
                        ticks: { color: '#8b949e' }
                    },
                    x: { 
                        grid: { display: false },
                        ticks: { color: '#8b949e' }
                    }
                }
            }
        });

        async function obtenerDatos() {
            try {
                const respuesta = await fetch('http://127.0.0.1:8000/api/lecturas/');
                const lecturas = await respuesta.json();

                const horas = lecturas.map(l => l.timestamp);
                const temperaturas = lecturas.map(l => l.temperatura);

                graficaTemperatura.data.labels = horas;
                graficaTemperatura.data.datasets[0].data = temperaturas;
                
                if (temperaturas.length > 0) {
                    const tempActual = temperaturas[temperaturas.length - 1];
                    const tempMax = Math.max(...temperaturas);
                    const tempMin = Math.min(...temperaturas);

                    // Actualizar Tarjetas (KPIs)
                    document.getElementById('kpi-actual').innerText = tempActual.toFixed(1) + ' °C';
                    document.getElementById('kpi-max').innerText = tempMax.toFixed(1) + ' °C';
                    document.getElementById('kpi-min').innerText = tempMin.toFixed(1) + ' °C';

                    const tituloGrafica = document.getElementById('titulo-grafica');

                    // Lógica de Alertas adaptada a colores oscuros
                    if (tempActual > 85) {
                        tituloGrafica.innerHTML = `<i class="fa-solid fa-triangle-exclamation mr-2 text-red-500"></i> <span class="text-red-500 font-bold animate-pulse">¡ALERTA CRÍTICA: SOBRECALENTAMIENTO!</span>`;
                        graficaTemperatura.data.datasets[0].borderColor = '#ef4444'; 
                        graficaTemperatura.data.datasets[0].backgroundColor = 'rgba(239, 68, 68, 0.2)';
                        graficaTemperatura.data.datasets[0].pointBorderColor = '#ef4444';
                    } else {
                        tituloGrafica.innerHTML = `<i class="fa-solid fa-temperature-half mr-2 text-[#00d2ff]"></i> <span class="text-white">Telemetría PT-1000 - Estado Normal</span>`;
                        graficaTemperatura.data.datasets[0].borderColor = '#00d2ff';
                        graficaTemperatura.data.datasets[0].backgroundColor = gradient;
                        graficaTemperatura.data.datasets[0].pointBorderColor = '#00d2ff';
                    }
                }

                graficaTemperatura.update();
            } catch (error) {
                console.error("Error de conexión RIS:", error);
            }
        }

        obtenerDatos();
        setInterval(obtenerDatos, 2000);
    </script>
</body>
</html>
